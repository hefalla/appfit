services:
  - type: web
    name: appfit-pro
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: APP_PIN
        value: "1234"
      - key: DATABASE_URL
        value: "file:./dev.db"
